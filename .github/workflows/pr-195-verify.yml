name: "PR 195 Verification"

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout pull request merge result
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm 9.15.9
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Record verification environment
        shell: bash
        run: |
          mkdir -p .ci-pr195-logs
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "checkout_sha=$(git rev-parse HEAD)"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
          } | tee .ci-pr195-logs/environment.log

      - name: Run verification matrix
        id: verification
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .ci-pr195-logs
          summary=".ci-pr195-logs/summary.md"
          failures=0

          {
            echo "## PR #195 verification"
            echo
            echo "| Check | Exit code |"
            echo "|---|---:|"
          } > "$summary"

          run_check() {
            local name="$1"
            shift
            local log=".ci-pr195-logs/${name}.log"

            echo "::group::${name}"
            "$@" 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            echo "EXIT_CODE=${status}" | tee -a "$log"
            echo "::endgroup::"
            echo "| ${name} | ${status} |" >> "$summary"

            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          }

          run_check install pnpm install --frozen-lockfile
          run_check verify_foundation pnpm verify:foundation
          run_check scan_secrets pnpm scan:secrets
          run_check scan_production_fixtures pnpm scan:production-fixtures
          run_check vitest_auth_public pnpm --filter @sovereign/worker exec vitest run src/auth-public.test.ts
          run_check smoke_release_closure pnpm smoke:release-closure
          run_check lint pnpm lint
          run_check typecheck pnpm typecheck
          run_check test pnpm test
          run_check build pnpm build
          run_check verify_worker_bundle_size pnpm verify:worker-bundle-size
          run_check verify_cloudflare_build pnpm verify:cloudflare-build

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -ne 0 ]; then
            echo "${failures} verification command(s) failed." >&2
            exit 1
          fi

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-195-verify-logs
          path: .ci-pr195-logs/
          if-no-files-found: warn
          retention-days: 7
