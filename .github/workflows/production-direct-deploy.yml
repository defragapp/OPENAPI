# Production deployment explicitly authorized by the repository owner.
name: Direct OPENAPI production deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-direct-deploy.yml'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'wrangler.production-direct.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-openapi-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build, migrate, and deploy OPENAPI to sovv-web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Select preinstalled Node 22
        run: |
          set -euo pipefail
          NODE22="$(find /opt/hostedtoolcache/node -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -1)"
          if [ -z "$NODE22" ] || [ ! -x "$NODE22/x64/bin/node" ]; then
            echo "::error::Node 22 is not available in the hosted tool cache"
            exit 1
          fi
          echo "$NODE22/x64/bin" >> "$GITHUB_PATH"
          "$NODE22/x64/bin/node" --version

      - name: Enable Corepack and install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify and build exact production commit
        env:
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADhGIF8-iOLIg8MU
        run: |
          set -euo pipefail
          pnpm verify:cloudflare-build

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN or CF_API_TOKEN is missing"
            exit 1
          fi

      - name: Provision OPENAPI production resources and deploy sovv-web
        env:
          CLOUDFLARE_ACCOUNT_ID: 8b1954d216d65077c6480d62583fe2c2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADhGIF8-iOLIg8MU
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-direct-production-deploy.mjs

      - name: Verify live production routes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            PUBLIC_STATUS="$(curl -L -sS -o /tmp/public.html -w '%{http_code}' https://sovereign.defrag.app/ || true)"
            LOGIN_STATUS="$(curl -L -sS -o /tmp/login.html -w '%{http_code}' https://app.defrag.app/login || true)"
            HEALTH_STATUS="$(curl -L -sS -o /tmp/health.json -w '%{http_code}' https://app.defrag.app/health || true)"
            READY_STATUS="$(curl -L -sS -o /tmp/ready.json -w '%{http_code}' https://app.defrag.app/ready || true)"
            if [ "$PUBLIC_STATUS" = "200" ] && [ "$LOGIN_STATUS" = "200" ] && [ "$HEALTH_STATUS" = "200" ] && [ "$READY_STATUS" = "200" ]; then
              node -e "const fs=require('fs');const expected=process.env.EXPECTED_SHA;const publicHtml=fs.readFileSync('/tmp/public.html','utf8');const loginHtml=fs.readFileSync('/tmp/login.html','utf8');const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));const ready=JSON.parse(fs.readFileSync('/tmp/ready.json','utf8'));if(!publicHtml.includes('See what is really happening'))throw new Error('public fingerprint missing');if(!/SOVEREIGN\\.OS/i.test(loginHtml))throw new Error('login fingerprint missing');if(!health.ok||!ready.ok||!ready.ready)throw new Error('health or readiness failed');if(health.version!==expected||ready.version!==expected)throw new Error('deployed commit mismatch');if(ready.dependencies?.privateExports!=='disabled')throw new Error('private exports are not disabled');console.log(JSON.stringify({health,ready},null,2));"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Sovereign.OS production routes did not become healthy after deployment"
          echo "public_status=$(curl -L -sS -o /dev/null -w '%{http_code}' https://sovereign.defrag.app/ || true)"
          echo "login_status=$(curl -L -sS -o /dev/null -w '%{http_code}' https://app.defrag.app/login || true)"
          echo "health_response=$(cat /tmp/health.json 2>/dev/null || true)"
          echo "ready_response=$(cat /tmp/ready.json 2>/dev/null || true)"
          exit 1

      - name: Deployment evidence
        if: always()
        run: |
          {
            echo "### Direct OPENAPI production deployment"
            echo
            echo "- repository: ${GITHUB_REPOSITORY}"
            echo "- commit_sha: ${GITHUB_SHA}"
            echo "- worker: sovv-web"
            echo "- public_url: https://sovereign.defrag.app"
            echo "- app_url: https://app.defrag.app"
            echo "- parent_url: https://defrag.app"
            echo "- d1: sovereign-openapi-db"
            echo "- queue: disabled"
            echo "- r2: disabled"
            echo "- private_exports: disabled"
            echo "- sharing: public-link-only"
            if [ -f production-deployment.json ]; then
              echo
              echo '```json'
              cat production-deployment.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
