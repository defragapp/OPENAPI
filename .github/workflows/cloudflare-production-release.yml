name: Cloudflare production release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production-release.yml'
  workflow_dispatch:

concurrency:
  group: sovereign-cloudflare-production-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner-probe:
    name: Verify production runner and credential
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Confirm runner allocation
        run: echo 'GitHub-hosted production runner allocated.'

      - name: Require Cloudflare deployment credential
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'CLOUDFLARE_API_TOKEN repository secret is required.' >&2
            exit 1
          fi
          echo 'Cloudflare deployment credential is available.'

  release:
    name: Verify and deploy current main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8b1954d216d65077c6480d62583fe2c2
      WORKERS_CI: '1'
      WORKERS_CI_BRANCH: main
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Require Cloudflare deployment credential
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'CLOUDFLARE_API_TOKEN repository secret is required.' >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical Cloudflare build gate
        run: pnpm verify:cloudflare-build

      - name: Deploy and verify production
        run: pnpm production:deploy
