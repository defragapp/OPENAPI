name: Auth Funnel CI

on:
  push:
    branches: [product/auth-onboarding-funnel-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-funnel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare release contract
        run: pnpm verify:cloudflare-build
