name: Trigger Cloudflare production build

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit SHA to build
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sovereign-cloudflare-production
  cancel-in-progress: false

jobs:
  trigger-and-verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cloudflare-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_ACCOUNT_ID: 8b1954d216d65077c6480d62583fe2c2
      CF_TRIGGER_UUID: 459985f1-3479-4be9-8497-33728bc3a56d
      CF_TOKEN_BUILDS: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_LEGACY: ${{ secrets.CF_API_TOKEN }}
      CF_DEPLOY_HOOK_URL: ${{ secrets.SOVV_WEB_DEPLOY_HOOK }}
      REQUESTED_SHA: ${{ inputs.target_sha || github.sha }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_SMOKE_TEST_RECIPIENT: ${{ secrets.EMAIL_SMOKE_TEST_RECIPIENT }}
      TRANSACTIONAL_FROM_EMAIL: info@defrag.app
      PUBLIC_CONTACT_EMAIL: info@defrag.app

    steps:
      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REQUESTED_SHA }}
          fetch-depth: 2

      - name: Validate release target
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::A full 40-character target SHA is required."
            exit 1
          fi
          git fetch origin main --depth=1
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$REQUESTED_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Refusing to build $REQUESTED_SHA because current main is $MAIN_SHA."
            exit 1
          fi
          echo "target_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
        id: release

      - name: Trigger exact Cloudflare Workers Build
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="${CF_TOKEN_BUILDS:-${CF_TOKEN_PRIMARY:-${CF_TOKEN_LEGACY:-}}}"
          if [[ -n "$CF_TOKEN" ]]; then
            RESPONSE="$(curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --url "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/triggers/${CF_TRIGGER_UUID}/builds" \
              --header "Authorization: Bearer ${CF_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"branch\":\"main\",\"commit_hash\":\"${REQUESTED_SHA}\"}")"
            echo "trigger_method=builds_api" >> "$GITHUB_OUTPUT"
            echo "cf_token_available=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$CF_DEPLOY_HOOK_URL" ]]; then
            RESPONSE="$(curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --url "$CF_DEPLOY_HOOK_URL")"
            echo "trigger_method=deploy_hook" >> "$GITHUB_OUTPUT"
            echo "cf_token_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Cloudflare Builds API token or protected deploy hook is configured in GitHub secrets."
            exit 1
          fi
          printf '%s' "$RESPONSE" > cloudflare-trigger.json
          BUILD_UUID="$(node -e "const p=JSON.parse(require('fs').readFileSync('cloudflare-trigger.json','utf8')); if(!p.success||!p.result?.build_uuid){console.error(JSON.stringify(p.errors||p));process.exit(1)}; process.stdout.write(p.result.build_uuid)")"
          echo "build_uuid=$BUILD_UUID" >> "$GITHUB_OUTPUT"
          echo "Cloudflare build UUID: $BUILD_UUID"

      - name: Monitor Cloudflare build and print failure logs
        if: steps.cloudflare.outputs.cf_token_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="${CF_TOKEN_BUILDS:-${CF_TOKEN_PRIMARY:-${CF_TOKEN_LEGACY:-}}}"
          BUILD_UUID="${{ steps.cloudflare.outputs.build_uuid }}"
          for ATTEMPT in $(seq 1 180); do
            curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
              --url "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/builds/${BUILD_UUID}" \
              --header "Authorization: Bearer ${CF_TOKEN}" > cloudflare-build.json
            STATUS="$(node -e "const p=JSON.parse(require('fs').readFileSync('cloudflare-build.json','utf8')); process.stdout.write(String(p.result?.status||'unknown'))")"
            OUTCOME="$(node -e "const p=JSON.parse(require('fs').readFileSync('cloudflare-build.json','utf8')); process.stdout.write(String(p.result?.build_outcome||'pending'))")"
            COMMIT="$(node -e "const p=JSON.parse(require('fs').readFileSync('cloudflare-build.json','utf8')); process.stdout.write(String(p.result?.build_trigger_metadata?.commit_hash||''))")"
            echo "Cloudflare build: status=$STATUS outcome=$OUTCOME commit=$COMMIT"
            if [[ -n "$COMMIT" && "$COMMIT" != "$REQUESTED_SHA" ]]; then
              echo "::error::Cloudflare is building $COMMIT instead of $REQUESTED_SHA."
              exit 1
            fi
            if [[ "$STATUS" == "stopped" ]]; then
              if [[ "$OUTCOME" == "success" ]]; then
                exit 0
              fi
              curl --silent --show-error --fail-with-body \
                --url "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/builds/${BUILD_UUID}/logs" \
                --header "Authorization: Bearer ${CF_TOKEN}" > cloudflare-build-logs.json || true
              node <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('cloudflare-build-logs.json')) process.exit(0);
          const payload = JSON.parse(fs.readFileSync('cloudflare-build-logs.json', 'utf8'));
          for (const line of payload.result?.lines ?? []) {
            console.error(Array.isArray(line) ? line.join(' ') : String(line));
          }
          NODE
              echo "::error::Cloudflare build stopped with outcome $OUTCOME."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Cloudflare build did not finish within 30 minutes."
          exit 1

      - name: Verify exact live Worker, routes, and dependencies
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED=false
          for ATTEMPT in $(seq 1 90); do
            curl --silent --show-error --fail --retry 2 --retry-all-errors \
              "https://sovv-web.sovereign-os-api.workers.dev/health" > worker-health.json || true
            curl --silent --show-error --fail --retry 2 --retry-all-errors \
              "https://app.defrag.app/health" > app-health.json || true
            curl --silent --show-error --fail --retry 2 --retry-all-errors \
              "https://app.defrag.app/ready" > app-ready.json || true
            if node <<'NODE'
          const fs = require('fs');
          const target = process.env.REQUESTED_SHA;
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          try {
            const worker = read('worker-health.json');
            const health = read('app-health.json');
            const ready = read('app-ready.json');
            const valid = worker.ok === true
              && worker.version === target
              && health.ok === true
              && health.version === target
              && ready.ready === true
              && ready.version === target
              && ready.migrationVersion === '0011_email_code_recovery'
              && ready.dependencies?.transactionalEmail === 'resend'
              && ready.dependencies?.publicContactEmail === 'info@defrag.app'
              && ready.dependencies?.transactionalFromEmail === 'info@defrag.app';
            if (!valid) process.exit(1);
          } catch { process.exit(1); }
          NODE
            then
              VERIFIED=true
              break
            fi
            sleep 10
          done
          if [[ "$VERIFIED" != "true" ]]; then
            echo "::error::Live health and readiness did not converge to $REQUESTED_SHA."
            for FILE in worker-health.json app-health.json app-ready.json; do
              [[ -f "$FILE" ]] && { echo "--- $FILE"; cat "$FILE"; echo; }
            done
            exit 1
          fi
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            "https://sovereign.defrag.app/" > public-home.html
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            "https://app.defrag.app/login" > login.html
          grep -q 'Know yourself. Understand the people around you. See the whole system.' public-home.html
          grep -q 'Sovereign.OS' login.html

      - name: Install release dependencies for email verification
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Send and confirm branded Resend delivery
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RESEND_API_KEY" ]]; then
            echo "::error::RESEND_API_KEY is not configured as a GitHub Actions secret, so a confirmed delivery test cannot run."
            exit 1
          fi
          pnpm smoke:email | tee email-smoke.json
          node -e "const p=JSON.parse(require('fs').readFileSync('email-smoke.json','utf8')); if(!p.ok||p.provider!=='resend'||p.lastEvent!=='delivered') process.exit(1)"

      - name: Publish release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-production-evidence-${{ steps.release.outputs.target_sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            cloudflare-trigger.json
            cloudflare-build.json
            cloudflare-build-logs.json
            worker-health.json
            app-health.json
            app-ready.json
            email-smoke.json

      - name: Write release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Sovereign.OS production release'
            echo
            echo "- Target SHA: \`$REQUESTED_SHA\`"
            echo "- Cloudflare build UUID: \`${{ steps.cloudflare.outputs.build_uuid }}\`"
            echo "- Trigger: \`${{ steps.cloudflare.outputs.trigger_method }}\`"
            if [[ -f app-ready.json ]]; then
              echo '- Readiness:'
              echo '```json'
              cat app-ready.json
              echo
              echo '```'
            fi
            if [[ -f email-smoke.json ]]; then
              echo '- Email delivery:'
              echo '```json'
              cat email-smoke.json
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
