name: PR 126 Safety Verification

on:
  push:
    branches:
      - codex/server-owned-safety-router
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-126-safety-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact safety head
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Activate repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Confirm exact checked-out SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'verified_sha=%s\n' "$GITHUB_SHA" | tee verification-evidence.txt

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical Cloudflare build gate
        run: pnpm verify:cloudflare-build

      - name: Record successful verification
        if: success()
        run: |
          {
            printf 'status=passed\n'
            printf 'verified_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } >> verification-evidence.txt

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-126-safety-verification-${{ github.sha }}
          path: verification-evidence.txt
          if-no-files-found: error
          retention-days: 14
