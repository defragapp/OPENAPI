name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Select preinstalled Node 22
        run: |
          set -euo pipefail
          NODE22="$(find /opt/hostedtoolcache/node -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -1)"
          if [ -z "$NODE22" ] || [ ! -x "$NODE22/x64/bin/node" ]; then
            echo "::error::Node 22 is not available in the hosted tool cache"
            exit 1
          fi
          echo "$NODE22/x64/bin" >> "$GITHUB_PATH"
          "$NODE22/x64/bin/node" --version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify foundation
        run: pnpm verify:foundation

      - name: Verify migrations
        run: pnpm verify:migrations

      - name: Scan secrets
        run: pnpm scan:secrets

      - name: Scan production fixtures
        run: pnpm scan:production-fixtures

      - name: Verify release configuration
        run: pnpm verify:release-config

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke authentication
        run: pnpm smoke:auth

      - name: Smoke Baseline
        run: pnpm smoke:baseline

      - name: Smoke jobs
        run: pnpm smoke:jobs

      - name: Smoke Worker gateway
        run: pnpm smoke:worker-gateway

      - name: Smoke Stripe
        run: pnpm smoke:stripe

      - name: Smoke product
        run: pnpm smoke:product

      - name: Smoke release closure
        run: pnpm smoke:release-closure
