name: Founder v0 visual-port validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/sovereign-worker/**'
      - 'packages/**'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/v0-visual-port-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0-visual-port-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify branch without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Use pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository foundation
        run: pnpm verify:foundation

      - name: Validate migrations
        run: pnpm verify:migrations

      - name: Scan secrets
        run: pnpm scan:secrets

      - name: Scan production fixtures
        run: pnpm scan:production-fixtures

      - name: Verify release configuration
        run: pnpm verify:release-config

      - name: Verify production contracts without deploying
        run: pnpm verify:production-release

      - name: Verify intelligence release
        run: pnpm verify:intelligence-release

      - name: Verify visual intelligence
        run: pnpm verify:visual-intelligence

      - name: Verify founder v0 platform contract
        run: pnpm verify:premium-platform

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build production bundles
        run: pnpm build

      - name: Verify Worker bundle size
        run: pnpm verify:worker-bundle-size

      - name: Upload built web bundle for rendered review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: founder-v0-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
