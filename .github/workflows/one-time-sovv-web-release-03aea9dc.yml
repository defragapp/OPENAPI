name: One-time sovv-web exact-main release 03aea9dc

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-time-sovv-web-release-03aea9dc.yml

permissions:
  contents: read

concurrency:
  group: one-time-sovv-web-release-03aea9dc
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'ops/cloudflare-release-03aea9dc'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: 03aea9dc700560cd999182ad5bbce7348076c6aa
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8b1954d216d65077c6480d62583fe2c2
      VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADhGIF8-iOLIg8MU

    steps:
      - name: Check out exact production source
        uses: actions/checkout@v4
        with:
          ref: 03aea9dc700560cd999182ad5bbce7348076c6aa
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run canonical Cloudflare production gate
        shell: bash
        run: pnpm verify:cloudflare-build

      - name: Deploy exact SHA to sovv-web
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_SHA \
            WORKERS_CI_COMMIT_SHA="$TARGET_SHA" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
            VITE_TURNSTILE_SITE_KEY="$VITE_TURNSTILE_SITE_KEY" \
            pnpm production:deploy

      - name: Verify exact live production SHA
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://sovv-web.sovereign-os-api.workers.dev/ready \
            https://sovereign.defrag.app/ready \
            https://app.defrag.app/ready; do
            body="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --max-time 30 "$url")"
            printf '%s' "$body" | grep -F "$TARGET_SHA"
            printf '%s' "$body" | grep -E '"ready"[[:space:]]*:[[:space:]]*true'
          done
