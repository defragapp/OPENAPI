name: Release Runner Probe

on:
  push:
    branches:
      - codex/inner-recognition-intelligence
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-hosted:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Confirm self-hosted runner
        run: |
          set -euo pipefail
          echo "self-hosted runner available"
          uname -a

  ubuntu-slim:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Confirm slim runner
        run: |
          set -euo pipefail
          echo "ubuntu-slim runner available"
          uname -a

  ubuntu-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Confirm ARM runner
        run: |
          set -euo pipefail
          echo "ubuntu ARM runner available"
          uname -a
