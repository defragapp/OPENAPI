name: Production dispatch bridge

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch-production:
    if: github.event.issue.number == 24 && github.event.comment.body == '/deploy production'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authorized production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-direct-deploy.yml --repo "${GITHUB_REPOSITORY}" --ref main
          BODY=$(cat <<EOF
          Automated deployment telemetry for the current Sovereign.OS production release.

          Status: workflow dispatch accepted
          Requested from issue: #24
          Bridge run ID: ${GITHUB_RUN_ID}
          Target ref: main
          EOF
          )
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/24" -f body="$BODY" -f state=open >/dev/null
