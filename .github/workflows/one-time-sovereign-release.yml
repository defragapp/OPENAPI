name: One-time Sovereign production release

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-time-sovereign-release.yml

permissions:
  contents: read

concurrency:
  group: sovereign-production-release
  cancel-in-progress: false

jobs:
  verify-deploy-and-prove:
    if: github.head_ref == 'ops/release-closure-0c3fbb'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_CI_COMMIT_SHA: 0c3fbbcd80ce763a54d14cb36fbbb707be3be6e8
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out exact production source
        uses: actions/checkout@v4
        with:
          ref: 0c3fbbcd80ce763a54d14cb36fbbb707be3be6e8
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify production build
        run: pnpm verify:cloudflare-build

      - name: Deploy and verify exact live release
        run: env -u GITHUB_SHA pnpm production:deploy

      - name: Record release evidence
        run: |
          test -f production-deployment.json
          node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('production-deployment.json','utf8')); if(value.commitSha !== process.env.WORKERS_CI_COMMIT_SHA && value.version !== process.env.WORKERS_CI_COMMIT_SHA) throw new Error('Deployment evidence does not match the exact main SHA'); console.log(JSON.stringify(value, null, 2));"
