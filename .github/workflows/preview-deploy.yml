name: Preview Deploy and Verification

# GitHub-hosted jobs currently fail before step one at the account/runner layer.
# Keep preview deployment available for deliberate manual use. Production pushes
# are built and deployed by the connected Cloudflare Workers Builds project.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-preview-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy protected Cloudflare preview
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Select preinstalled Node 22
        run: |
          set -euo pipefail
          NODE22="$(find /opt/hostedtoolcache/node -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -1)"
          if [ -z "$NODE22" ] || [ ! -x "$NODE22/x64/bin/node" ]; then
            echo "::error::Node 22 is not available in the hosted tool cache"
            exit 1
          fi
          echo "$NODE22/x64/bin" >> "$GITHUB_PATH"
          "$NODE22/x64/bin/node" --version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local verification gate
        run: |
          set -euo pipefail
          pnpm verify:foundation
          pnpm verify:migrations
          pnpm scan:secrets
          pnpm scan:production-fixtures
          pnpm verify:release-config
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke:auth
          pnpm smoke:baseline
          pnpm smoke:jobs
          pnpm smoke:worker-gateway
          pnpm smoke:stripe
          pnpm smoke:product
          pnpm smoke:release-closure
          pnpm build:preview

      - name: Require preview protection configuration
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CF_ACCESS_CLIENT_ID:-}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            echo "::error::Cloudflare Access service-token secrets are required for preview verification"
            exit 1
          fi

      - name: Resolve preview session secret
        id: preview-secret
        shell: bash
        run: |
          set -euo pipefail
          SECRET="${{ secrets.PREVIEW_SESSION_SIGNING_SECRET }}"
          if [ -z "$SECRET" ]; then
            SECRET="$(openssl rand -hex 32)"
          fi
          echo "::add-mask::$SECRET"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Bootstrap resources and deploy preview
        id: preview-deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_WORKER_NAME: ${{ vars.PREVIEW_WORKER_NAME || 'sovereign-openapi-preview' }}
          PREVIEW_D1_NAME: ${{ vars.PREVIEW_D1_NAME || 'sovereign-openapi-preview-db' }}
          CONFIGURED_PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
          PREVIEW_SESSION_SIGNING_SECRET: ${{ steps.preview-secret.outputs.secret }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'cloudflare-gateway' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-5.5' }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'sovereign' }}
          SOVV_BASE_URL: ${{ vars.SOVV_BASE_URL }}
          SCRIPTURE_TRANSLATION: ${{ vars.SCRIPTURE_TRANSLATION || 'WEB' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_SOVEREIGN_PLUS_MONTHLY: ${{ vars.STRIPE_PRICE_SOVEREIGN_PLUS_MONTHLY }}
          STRIPE_PRICE_SOVEREIGN_PLUS_ANNUAL: ${{ vars.STRIPE_PRICE_SOVEREIGN_PLUS_ANNUAL }}
          STRIPE_SUCCESS_URL: ${{ vars.STRIPE_SUCCESS_URL }}
          STRIPE_CANCEL_URL: ${{ vars.STRIPE_CANCEL_URL }}
          STRIPE_PORTAL_RETURN_URL: ${{ vars.STRIPE_PORTAL_RETURN_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repository variable is not configured"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured"
            exit 1
          fi
          pnpm preview:bootstrap
          DEPLOYED_URL="$(node -e "console.log(require('./preview-deployment.json').deployedUrl)")"
          URL="${CONFIGURED_PREVIEW_BASE_URL:-$DEPLOYED_URL}"
          echo "deployed_url=$DEPLOYED_URL" >> "$GITHUB_OUTPUT"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare Access perimeter
        env:
          PREVIEW_BASE_URL: ${{ steps.preview-deploy.outputs.preview_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm verify:preview-access

      - name: Create protected preview session cookie
        id: preview-session
        env:
          PREVIEW_SESSION_SIGNING_SECRET: ${{ steps.preview-secret.outputs.secret }}
          PREVIEW_SESSION_SUBJECT: preview:user:github-actions
        run: |
          set -euo pipefail
          COOKIE="$(pnpm --silent preview:session)"
          echo "::add-mask::$COOKIE"
          echo "cookie=$COOKIE" >> "$GITHUB_OUTPUT"

      - name: Wait for protected preview readiness
        env:
          PREVIEW_URL: ${{ steps.preview-deploy.outputs.preview_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$PREVIEW_URL/ready" >/tmp/ready.json; then
              cat /tmp/ready.json | node -e "let data='';process.stdin.on('data',c=>data+=c);process.stdin.on('end',()=>{const parsed=JSON.parse(data); if (!parsed.ok) process.exit(1);});" && exit 0
            fi
            sleep 2
          done
          echo "::error::Protected preview readiness did not become healthy"
          exit 1

      - name: Live Cloudflare Gateway verification
        env:
          AI_PROVIDER: cloudflare-gateway
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-5.5' }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'sovereign' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm smoke:gateway
          pnpm smoke:sovereign

      - name: Authenticated protected-preview product smoke
        env:
          PREVIEW_BASE_URL: ${{ steps.preview-deploy.outputs.preview_url }}
          PREVIEW_SESSION_COOKIE: ${{ steps.preview-session.outputs.cookie }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_EXPECT_STRIPE: ${{ vars.PREVIEW_EXPECT_STRIPE || '0' }}
        run: pnpm smoke:preview

      - name: Sanitized preview summary
        if: always()
        run: |
          {
            echo "### Sovereign protected preview deployment"
            echo
            echo "- commit_sha: ${GITHUB_SHA}"
            echo "- worker_name: ${{ vars.PREVIEW_WORKER_NAME || 'sovereign-openapi-preview' }}"
            echo "- d1_name: ${{ vars.PREVIEW_D1_NAME || 'sovereign-openapi-preview-db' }}"
            echo "- model: ${{ vars.AI_MODEL || 'openai/gpt-5.5' }}"
            echo "- gateway_id: ${{ vars.AI_GATEWAY_ID || 'sovereign' }}"
            echo "- protected_preview_url: ${{ steps.preview-deploy.outputs.preview_url }}"
            echo "- deployed_worker_url: ${{ steps.preview-deploy.outputs.deployed_url }}"
            echo "- access_perimeter: required and verified"
            echo "- remote_smoke: public pages, app auth, plan gates, AI stream"
          } >> "$GITHUB_STEP_SUMMARY"
