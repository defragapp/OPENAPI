name: PR 195 final verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-195-final-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Full release matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Verify repository state
        run: |
          git status --short
          git diff --check origin/main...HEAD
          git diff --name-status origin/main...HEAD
          git check-ignore -v scripts/.cloudflare-production-deploy-v3.generated.mjs
          test -z "$(git ls-files scripts/.cloudflare-production-deploy-v3.generated.mjs)"
          test "$(git rev-list --count HEAD..origin/main)" = "0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify foundation
        run: pnpm verify:foundation

      - name: Scan secrets
        run: pnpm scan:secrets

      - name: Scan production fixtures
        run: pnpm scan:production-fixtures

      - name: Verify Turnstile regression
        run: pnpm --filter @sovereign/worker exec vitest run src/auth-public.test.ts

      - name: Release closure smoke
        run: pnpm smoke:release-closure

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify Worker bundle size
        run: pnpm verify:worker-bundle-size

      - name: Verify Cloudflare build
        run: pnpm verify:cloudflare-build
