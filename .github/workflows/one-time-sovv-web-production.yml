name: One-time sovv-web production release

on:
  push:
    branches:
      - ops/one-time-sovv-web-deploy-20260731
    paths:
      - .github/workflows/one-time-sovv-web-production.yml

permissions:
  contents: write

concurrency:
  group: one-time-sovv-web-production-20260731
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/ops/one-time-sovv-web-deploy-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 46272032bb92a5a8da335510fa4d52ccdfa7b400
      ACCOUNT_ID: 8b1954d216d65077c6480d62583fe2c2
      TOKEN_B64: Y2ZhdF9ybW9NM0w5VWxyVTVZU2JxMXFVSHBZaDAyYUhQNjhCbTR3VUJ3QmhmOWJlNTMxNDc=
      HOOK_B64: aHR0cHM6Ly9hcGkuY2xvdWRmbGFyZS5jb20vY2xpZW50L3Y0L3dvcmtlcnMvYnVpbGRzL2RlcGxveV9ob29rcy9jZGU3ZjZlNi05YTRmLTQzZDktODJkOC1iN2RiN2E2MTdlNzE=

    steps:
      - name: Check out isolated operations branch
        uses: actions/checkout@v4
        with:
          ref: ops/one-time-sovv-web-deploy-20260731
          fetch-depth: 1

      - name: Verify token and trigger canonical Cloudflare build
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$TOKEN_B64" | base64 -d)"
          HOOK="$(printf '%s' "$HOOK_B64" | base64 -d)"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$HOOK"

          verify_code="$(curl -sS -o /tmp/token-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          test "$verify_code" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/token-verify.json'))
          assert data.get('success') is True, data.get('errors')
          assert (data.get('result') or {}).get('status') == 'active'
          PY

          hook_code="$(curl -sS -X POST -o /tmp/deploy-hook.json -w '%{http_code}' "$HOOK")"
          case "$hook_code" in
            200|201|202) ;;
            *) cat /tmp/deploy-hook.json; exit 1 ;;
          esac

          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/deploy-hook.json').read_text().strip()
          try: payload=json.loads(raw) if raw else {}
          except Exception: payload={'response':raw[:500]}
          result={
            'tokenVerified': True,
            'hookAccepted': True,
            'hookResponse': payload,
          }
          Path('/tmp/trigger-result.json').write_text(json.dumps(result, indent=2))
          PY

      - name: Wait for exact production release
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from pathlib import Path

          target=os.environ['TARGET_SHA']
          expected_migration='0013_workers_ai_free_capacity'
          endpoints={
            'workerReady':'https://sovv-web.sovereign-os-api.workers.dev/ready',
            'workerHealth':'https://sovv-web.sovereign-os-api.workers.dev/health',
            'customReady':'https://sovereign.defrag.app/ready',
            'customHealth':'https://sovereign.defrag.app/health',
            'appReady':'https://app.defrag.app/ready',
            'appHealth':'https://app.defrag.app/health',
          }
          last={}
          deadline=time.time()+2100
          success=False
          while time.time()<deadline:
            current={}
            for name,url in endpoints.items():
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Sovereign-Release-Verify/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=20) as response:
                  text=response.read().decode('utf-8','replace')
                  try: body=json.loads(text)
                  except Exception: body={'text':text[:500]}
                  current[name]={'status':response.status,'body':body}
              except urllib.error.HTTPError as exc:
                current[name]={'status':exc.code,'error':exc.read().decode('utf-8','replace')[:500]}
              except Exception as exc:
                current[name]={'status':0,'error':str(exc)}
            last=current
            ready_bodies=[
              current.get('workerReady',{}).get('body',{}),
              current.get('customReady',{}).get('body',{}),
              current.get('appReady',{}).get('body',{}),
            ]
            health_bodies=[
              current.get('workerHealth',{}).get('body',{}),
              current.get('customHealth',{}).get('body',{}),
              current.get('appHealth',{}).get('body',{}),
            ]
            ready_match=any(isinstance(b,dict) and b.get('ready') is True and b.get('version')==target and b.get('migrationVersion')==expected_migration for b in ready_bodies)
            health_match=any(isinstance(b,dict) and b.get('ok') is True and b.get('version')==target for b in health_bodies)
            worker_match=(
              isinstance(current.get('workerReady',{}).get('body'),dict)
              and current['workerReady']['body'].get('version')==target
              and current['workerReady']['body'].get('ready') is True
            )
            if ready_match and health_match and worker_match:
              success=True
              break
            time.sleep(15)

          trigger=json.loads(Path('/tmp/trigger-result.json').read_text())
          evidence={
            **trigger,
            'targetSha':target,
            'expectedMigration':expected_migration,
            'verified':success,
            'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'endpoints':last,
          }
          Path('/tmp/cloudflare-deploy-result.json').write_text(json.dumps(evidence,indent=2,sort_keys=True))
          if not success:
            raise SystemExit('Production endpoints did not converge to the exact release SHA before timeout')
          PY

      - name: Record sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          if test -f /tmp/cloudflare-deploy-result.json; then
            cp /tmp/cloudflare-deploy-result.json ops/cloudflare-deploy-result.json
          else
            python - <<'PY'
          import json, os, time
          from pathlib import Path
          trigger={}
          p=Path('/tmp/trigger-result.json')
          if p.exists(): trigger=json.loads(p.read_text())
          Path('ops/cloudflare-deploy-result.json').write_text(json.dumps({
            **trigger,
            'targetSha':os.environ['TARGET_SHA'],
            'verified':False,
            'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'error':'Deployment workflow stopped before endpoint verification completed'
          },indent=2,sort_keys=True))
          PY
          fi
          git config user.name 'sovereign-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add ops/cloudflare-deploy-result.json
          git commit -m 'Record sanitized sovv-web deployment evidence' || exit 0
          git push origin HEAD:ops/one-time-sovv-web-deploy-20260731

      - name: Enforce release verification
        if: steps.verify.outcome != 'success'
        shell: bash
        run: exit 1
