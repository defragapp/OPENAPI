name: Live Cloudflare Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: live-cloudflare-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      PUBLIC_BASE: https://sovereign.defrag.app
      APP_BASE: https://app.defrag.app
    steps:
      - name: Publish pending production status
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${{ github.token }}" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" --data '{"state":"pending","context":"production/live-cloudflare","description":"Waiting for Cloudflare production convergence","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Verify deployed commit, account funnel, billing safety, and production pages
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          expected = os.environ['EXPECTED_SHA'].strip()
          public_base = os.environ['PUBLIC_BASE'].rstrip('/')
          app_base = os.environ['APP_BASE'].rstrip('/')

          def fetch(url, *, follow=True, method='GET', headers=None, body=None):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                      return None
              opener = urllib.request.build_opener() if follow else urllib.request.build_opener(NoRedirect())
              request_headers = {'User-Agent': 'Sovereign.OS production verifier', **(headers or {})}
              payload = body.encode('utf-8') if isinstance(body, str) else body
              request = urllib.request.Request(url, data=payload, headers=request_headers, method=method)
              try:
                  with opener.open(request, timeout=20) as response:
                      return response.status, {k.lower(): v for k, v in response.headers.items()}, response.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as error:
                  return error.code, {k.lower(): v for k, v in error.headers.items()}, error.read().decode('utf-8', 'replace')
              except urllib.error.URLError as error:
                  return 0, {}, str(error.reason)

          ready_payload = None
          last_ready = ''
          for attempt in range(60):
              status, _, body = fetch(f'{app_base}/ready')
              last_ready = f'status={status} body={body[:500]}'
              try:
                  payload = json.loads(body)
              except json.JSONDecodeError:
                  payload = {}
              if status == 200 and payload.get('ready') is True and payload.get('version') == expected:
                  ready_payload = payload
                  break
              time.sleep(10)

          if ready_payload is None:
              raise SystemExit(f'Cloudflare did not converge to {expected}: {last_ready}')
          if ready_payload.get('migrationVersion') != '0010_auth_password_oauth_onboarding':
              raise SystemExit(f'Unexpected migration version: {ready_payload.get("migrationVersion")}')
          if ready_payload.get('authenticationModes', {}).get('passwordProtocol') != 'browser-key-v1':
              raise SystemExit('browser-key-v1 is not active')

          health_status, health_headers, health_body = fetch(f'{app_base}/health')
          if health_status != 200:
              raise SystemExit(f'Health returned {health_status}: {health_body[:500]}')
          try:
              health_payload = json.loads(health_body)
          except json.JSONDecodeError as error:
              raise SystemExit(f'Health returned invalid JSON: {error}')
          if health_payload.get('version') != expected:
              raise SystemExit(f'Health version mismatch: {health_payload.get("version")}')
          if health_payload.get('ok') is not True:
              raise SystemExit(f'Health is not ok: {health_body[:500]}')
          if health_payload.get('authenticationModes', {}).get('password') != 'configured':
              raise SystemExit('Email and password authentication is not configured')

          public_routes = [
              '/', '/how-it-works.html', '/how-it-works', '/pricing.html', '/pricing',
              '/faq.html', '/faq', '/privacy', '/terms'
          ]
          app_routes = [
              '/login', '/signup', '/forgot-password', '/reset-password', '/onboarding',
              '/app', '/invitation', '/consent.html'
          ]
          pages = {}

          for route in public_routes:
              status, headers, body = fetch(f'{public_base}{route}')
              if status != 200:
                  raise SystemExit(f'{public_base}{route} returned {status}')
              pages[f'public:{route}'] = (headers, body)

          for route in app_routes:
              status, headers, body = fetch(f'{app_base}{route}')
              if status != 200:
                  raise SystemExit(f'{app_base}{route} returned {status}')
              pages[f'app:{route}'] = (headers, body)

          static_expectations = {
              'public:/how-it-works.html': [
                  'One Baseline. An entire life in context.',
                  'THE PLATFORM IN FOUR PARTS',
                  'Shadow and light',
                  '/launch-polish.css?v=20260726-final-r1'
              ],
              'public:/pricing.html': [
                  'Begin with yourself. Expand to every relationship and system your life includes.',
                  'Complete private Baseline Design',
                  '$20',
                  '$99',
                  'Optional Covenant lens with Christian teaching and biblical scripture',
                  '/launch-polish.css?v=20260726-final-r1',
                  '/pricing-funnel.css?v=20260726-auth-r1',
                  '/signup?plan=sovereign_plus&amp;interval=monthly',
                  '/signup?plan=sovereign_plus&amp;interval=annual'
              ],
              'public:/faq.html': [
                  'What it is. What you can explore. What it never pretends to know.',
                  'What do shadow and light mean?',
                  'What does alignment mean?',
                  'What is Covenant?',
                  '/launch-polish.css?v=20260726-final-r1'
              ]
          }

          for page, fingerprints in static_expectations.items():
              body = pages[page][1]
              for fingerprint in fingerprints:
                  if fingerprint not in body:
                      raise SystemExit(f'{page} is missing copy fingerprint: {fingerprint}')

          home = pages['public:/'][1]
          match = re.search(r'src=["\'](/assets/[^"\']+\.js)["\']', home)
          if not match:
              raise SystemExit('Public home does not expose a compiled JavaScript asset')
          asset_status, asset_headers, asset_body = fetch(f'{public_base}{match.group(1)}')
          if asset_status != 200:
              raise SystemExit(f'Compiled JavaScript asset returned {asset_status}')

          bundle_fingerprints = [
              'Know yourself. Understand the system. Choose what fits.',
              'shadow and light',
              'See the relationship from both sides.',
              'Understand the whole system.',
              'Meet your Baseline Design.',
              'Optional Christian and biblical lens.',
              'Create your Sovereign.OS account.',
              'Forgot password?',
              'Choose how far you want to begin.',
              'Build your starting map.',
              'Your password stays in this browser'
          ]
          for fingerprint in bundle_fingerprints:
              if fingerprint not in asset_body:
                  raise SystemExit(f'Compiled application is missing: {fingerprint}')

          intelligence_js_status, _, intelligence_js = fetch(f'{app_base}/intelligence-ui.js?v=20260726-baseline-first-r1')
          intelligence_css_status, _, intelligence_css = fetch(f'{app_base}/intelligence-ui.css?v=20260726-baseline-first-r1')
          if intelligence_js_status != 200 or intelligence_css_status != 200:
              raise SystemExit('Baseline-first intelligence assets are unavailable')
          for fingerprint in [
              'YOUR BASELINE, ALIVE TODAY',
              'ALIGNMENT NEEDLE',
              'SHADOW–LIGHT RAIL',
              'TWO PEOPLE · TWO BASELINES',
              'SEE THE WHOLE SYSTEM',
              'sovereign-context-bar',
              'structured-response-card'
          ]:
              if fingerprint not in intelligence_js:
                  raise SystemExit(f'Intelligence runtime is missing: {fingerprint}')
          for fingerprint in ['prefers-reduced-motion', 'prefers-contrast: more', '@media (max-width: 720px)']:
              if fingerprint not in intelligence_css:
                  raise SystemExit(f'Intelligence stylesheet is missing: {fingerprint}')

          polish_status, _, polish_body = fetch(f'{public_base}/launch-polish.css?v=20260726-final-r1')
          if polish_status != 200 or 'prefers-reduced-motion' not in polish_body or 'animation-timeline: view()' not in polish_body:
              raise SystemExit('Public polish stylesheet is unavailable or incomplete')

          for page, (headers, _) in pages.items():
              required_headers = {
                  'strict-transport-security': 'max-age=31536000',
                  'x-content-type-options': 'nosniff',
                  'x-frame-options': 'deny',
                  'content-security-policy': "frame-ancestors 'none'"
              }
              for name, fragment in required_headers.items():
                  if fragment.lower() not in headers.get(name, '').lower():
                      raise SystemExit(f'{page} is missing {name}: {fragment}')
              if page.startswith('app:') and 'noindex' not in headers.get('x-robots-tag', '').lower():
                  raise SystemExit(f'{page} is indexable')

          if 'immutable' not in asset_headers.get('cache-control', '').lower():
              raise SystemExit('Compiled JavaScript is not served with immutable caching')
          if 'no-store' not in health_headers.get('cache-control', '').lower():
              raise SystemExit('Health is not served with no-store caching')

          session_status, _, _ = fetch(f'{app_base}/api/v1/auth/session', follow=False)
          account_status, _, _ = fetch(f'{app_base}/api/v1/you', follow=False)
          checkout_status, _, _ = fetch(
              f'{app_base}/api/v1/billing/checkout',
              follow=False,
              method='POST',
              headers={
                  'origin': app_base,
                  'content-type': 'application/json',
                  'x-idempotency-key': f'live-verifier-{expected[:16]}'
              },
              body=json.dumps({'interval': 'monthly'})
          )
          webhook_status, _, _ = fetch(
              f'{app_base}/api/v1/stripe/webhook',
              follow=False,
              method='POST',
              headers={'content-type': 'application/json', 'stripe-signature': 't=0,v1=invalid'},
              body=json.dumps({'id': 'evt_live_verifier_invalid', 'type': 'customer.subscription.updated', 'data': {'object': {}}})
          )
          signup_status, _, _ = fetch(
              f'{app_base}/api/v1/auth/password/signup',
              follow=False,
              method='POST',
              headers={'origin': app_base, 'content-type': 'application/json'},
              body=json.dumps({
                  'email': f'live-verifier-{expected[:12]}@example.invalid',
                  'name': 'Production Verifier',
                  'termsAccepted': True
              })
          )
          challenge_status, _, _ = fetch(
              f'{app_base}/api/v1/auth/password/challenge',
              follow=False,
              method='POST',
              headers={'origin': app_base, 'content-type': 'application/json'},
              body=json.dumps({'email': f'live-verifier-{expected[:12]}@example.invalid'})
          )

          if session_status != 401:
              raise SystemExit(f'Unauthenticated session returned {session_status}')
          if account_status != 401:
              raise SystemExit(f'Unauthenticated account returned {account_status}')
          if checkout_status != 401:
              raise SystemExit(f'Unauthenticated checkout returned {checkout_status}')
          if webhook_status != 400:
              raise SystemExit(f'Invalid Stripe signature returned {webhook_status}')
          if signup_status != 400:
              raise SystemExit(f'Password signup without Turnstile returned {signup_status}')
          if challenge_status != 400:
              raise SystemExit(f'Password challenge without Turnstile returned {challenge_status}')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as output:
                  output.write('## Sovereign.OS live verification\n\n')
                  output.write(f'- Deployed commit: `{ready_payload.get("version")}`\n')
                  output.write(f'- Migration: `{ready_payload.get("migrationVersion")}`\n')
                  output.write(f'- Public routes checked: {len(public_routes)}\n')
                  output.write(f'- App routes checked: {len(app_routes)}\n')
                  output.write('- Password protocol and Turnstile boundaries: passed\n')
                  output.write('- Pricing intent and onboarding pages: passed\n')
                  output.write('- Stripe signature and checkout boundary: passed\n')
                  output.write('- Baseline-first intelligence assets: passed\n')
                  output.write('- Product language, motion, and reduced-motion assets: passed\n')
                  output.write('- Security headers and immutable assets: passed\n')

          print(json.dumps({
              'ready': True,
              'version': ready_payload.get('version'),
              'migrationVersion': ready_payload.get('migrationVersion'),
              'passwordProtocol': ready_payload.get('authenticationModes', {}).get('passwordProtocol'),
              'publicRoutes': len(public_routes),
              'appRoutes': len(app_routes),
              'authBoundaries': 'passed',
              'onboarding': 'passed',
              'stripeBoundary': 'passed',
              'intelligenceAssets': 'passed'
          }, indent=2))
          PY

      - name: Publish successful production status
        if: success() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${{ github.token }}" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" --data '{"state":"success","context":"production/live-cloudflare","description":"Exact commit is live; account and Stripe boundaries passed","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Publish failed production status
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${{ github.token }}" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" --data '{"state":"failure","context":"production/live-cloudflare","description":"Cloudflare convergence or live verification failed","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
