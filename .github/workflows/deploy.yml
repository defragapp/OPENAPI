name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'wrangler.jsonc'
      - 'wrangler.production-direct.jsonc'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sovereign-openapi-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Verify, migrate, and deploy Sovereign.OS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Automated deployment telemetry for the current Sovereign.OS production release.

          Status: running
          Commit: ${GITHUB_SHA}
          Run ID: ${GITHUB_RUN_ID}
          Run attempt: ${GITHUB_RUN_ATTEMPT}
          Registered workflow: Deploy
          EOF
          )
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/24" -f body="$BODY" -f state=open >/dev/null

      - name: Checkout exact commit
        id: checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Select preinstalled Node 22
        id: node
        run: |
          set -euo pipefail
          NODE22="$(find /opt/hostedtoolcache/node -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -1)"
          if [ -z "$NODE22" ] || [ ! -x "$NODE22/x64/bin/node" ]; then
            echo "::error::Node 22 is not available in the hosted tool cache"
            exit 1
          fi
          echo "$NODE22/x64/bin" >> "$GITHUB_PATH"
          "$NODE22/x64/bin/node" --version

      - name: Install dependencies
        id: install
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify complete production build
        id: verify
        env:
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADhGIF8-iOLIg8MU
        run: |
          set -euo pipefail
          pnpm verify:cloudflare-build

      - name: Require Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN or CF_API_TOKEN is missing"
            exit 1
          fi

      - name: Deploy and run live production probes
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: 8b1954d216d65077c6480d62583fe2c2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADhGIF8-iOLIg8MU
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-direct-production-deploy.mjs

      - name: Publish final deployment state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Automated deployment telemetry for the current Sovereign.OS production release.

          Status: ${JOB_STATUS}
          Commit: ${GITHUB_SHA}
          Run ID: ${GITHUB_RUN_ID}
          Run attempt: ${GITHUB_RUN_ATTEMPT}

          Step outcomes:
          - checkout: ${CHECKOUT_OUTCOME}
          - node: ${NODE_OUTCOME}
          - install: ${INSTALL_OUTCOME}
          - verify: ${VERIFY_OUTCOME}
          - credentials: ${CREDENTIALS_OUTCOME}
          - deploy and live verification: ${DEPLOY_OUTCOME}

          Runtime contract:
          - worker: sovv-web
          - D1: sovereign-openapi-db
          - Queue: disabled
          - R2: disabled
          - private exports: disabled
          - sharing: public-link-only
          EOF
          )
          if [ "$JOB_STATUS" = "success" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/24" -f body="$BODY" -f state=closed -f state_reason=completed >/dev/null
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/24" -f body="$BODY" -f state=open >/dev/null
          fi