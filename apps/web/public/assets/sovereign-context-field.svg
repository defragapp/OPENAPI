<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Sovereign context field</title>
  <description id="description">A restrained field of translucent planes and lines reorganizing around a central opening.</description>
  <defs>
    <linearGradient id="planeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e8" stop-opacity=".34"/>
      <stop offset=".46" stop-color="#b5c3b4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#101310" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="planeB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98762" stop-opacity=".24"/>
      <stop offset=".52" stop-color="#d9d4ca" stop-opacity=".13"/>
      <stop offset="1" stop-color="#111412" stop-opacity=".01"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3eee5" stop-opacity="0"/>
      <stop offset=".38" stop-color="#f3eee5" stop-opacity=".58"/>
      <stop offset=".62" stop-color="#a7b7a5" stop-opacity=".42"/>
      <stop offset="1" stop-color="#c98762" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="signal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d79a72" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#a7b7a5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0b0e0c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <mask id="fade">
      <linearGradient id="fadeGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="black"/>
        <stop offset=".18" stop-color="white"/>
        <stop offset=".9" stop-color="white"/>
        <stop offset="1" stop-color="black"/>
      </linearGradient>
      <rect width="1600" height="1000" fill="url(#fadeGradient)"/>
    </mask>
  </defs>

  <ellipse cx="1040" cy="530" rx="380" ry="310" fill="url(#signal)" filter="url(#soft)" opacity=".72"/>

  <g mask="url(#fade)" filter="url(#depth)">
    <path d="M520 246C718 176 973 174 1282 250C1178 302 1084 353 1000 402C846 340 684 322 520 347C550 313 550 280 520 246Z" fill="url(#planeA)" stroke="#eee9df" stroke-opacity=".16"/>
    <path d="M590 406C782 326 1024 334 1340 424C1230 466 1124 515 1028 574C858 514 700 498 540 520C576 478 592 440 590 406Z" fill="url(#planeB)" stroke="#e8e2d8" stroke-opacity=".14"/>
    <path d="M548 594C748 528 970 548 1288 652C1166 692 1068 734 976 786C810 724 660 702 486 718C536 676 554 634 548 594Z" fill="url(#planeA)" stroke="#dce4da" stroke-opacity=".13"/>
    <path d="M716 760C878 712 1072 724 1288 804C1184 830 1084 864 994 904C856 858 732 838 594 844C652 816 692 786 716 760Z" fill="url(#planeB)" stroke="#eadfd3" stroke-opacity=".1"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M566 322C734 370 846 440 950 558C1058 680 1166 720 1320 734" stroke="#a9b9a8" stroke-opacity=".19" stroke-width="2"/>
    <path d="M636 250C824 336 922 458 1002 614C1068 744 1158 806 1280 838" stroke="#e9e4da" stroke-opacity=".12" stroke-width="1.5"/>
    <path d="M714 210C860 330 942 450 1000 604C1058 758 1120 828 1226 892" stroke="#c98762" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M484 646C680 626 838 652 974 724C1096 788 1196 810 1338 804" stroke="#e9e4da" stroke-opacity=".1" stroke-width="1"/>
  </g>

  <g>
    <rect x="986" y="190" width="2" height="670" rx="1" fill="url(#edge)"/>
    <rect x="1001" y="248" width="1" height="554" rx=".5" fill="#c98762" fill-opacity=".34"/>
    <circle cx="987" cy="404" r="4" fill="#e9e3da" fill-opacity=".64"/>
    <circle cx="1001" cy="574" r="3" fill="#a7b7a5" fill-opacity=".7"/>
    <circle cx="987" cy="728" r="2.5" fill="#c98762" fill-opacity=".72"/>
  </g>
</svg>
